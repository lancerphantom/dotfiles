# Where the RGB lighting project lives and which revision this dotfiles state
# was tested against. Read by the BOOTSTRAP "RGB lighting" step.
#
# RGB_DIR   keep it at this path: .zshrc sources $RGB_DIR/shell/rgb.zsh and
#           install.sh links ~/bin/rgb* and ~/.config/rgb-fx into it.
# RGB_REPO  git URL to clone from on a new machine (private, needs the SSH key).
# RGB_REF   commit to check out after cloning. Bump it by hand after changes
#           in rgb-lights are pushed: git -C "$RGB_DIR" rev-parse HEAD
RGB_DIR="$HOME/projects/claudeCode/rgb-lights"
RGB_REPO="git@github.com:lancerphantom/rgb-lights.git"
RGB_REF="6e2064dde6fd89e8626cf0cc1d2e7111559e3d4c"
