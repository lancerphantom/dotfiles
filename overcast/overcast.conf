# Where the Overcast project lives and which revision this dotfiles state
# was saved against. Read by overcast-restore.sh and overcast-save.sh.
#
# OVERCAST_DIR   keep it at this path: the systemd units point here
#                (%h/projects/claudeCode/kdeCons). If you move it,
#                overcast-restore.sh rewrites the unit paths on install.
# OVERCAST_REPO  git URL to clone from on a new machine. Empty until the
#                Overcast project is pushed to GitHub.
# OVERCAST_REF   commit to check out after cloning. overcast-save.sh updates
#                it from the Overcast checkout's HEAD.
OVERCAST_DIR="$HOME/projects/claudeCode/kdeCons"
OVERCAST_REPO="git@github.com:lancerphantom/overcast.git"
OVERCAST_REF="e5e95cb6d6af77c20d73b8046d200c967a85e511"
