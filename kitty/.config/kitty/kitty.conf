# kitty — Overcast. Rebuilt from scratch 2026-11-08 (old setup: ~/.config/overcast-backup/terminal-*).
# Colours live in ~/.local/share/overcast/terminal/kitty-colors.conf, written by
# Overcast's terminal.py on every wallpaper change and pushed live into open
# windows. Shortcuts: press F1.

include ~/.local/share/overcast/terminal/kitty-colors.conf

# --- text ---
font_family       JetBrainsMono Nerd Font Mono
font_size         12.0
disable_ligatures cursor

# --- window: Overcast title bar (round buttons, see titlebar.py), slightly see-through, wallpaper blurred behind ---
hide_window_decorations no
background_opacity      0.9
background_blur         32
window_padding_width    10 14
remember_window_size    no
initial_window_width    75c
initial_window_height   45c
confirm_os_window_close 0

# --- cursor: glow-coloured block that leaves a short trail when it jumps ---
cursor_shape                  block
cursor_blink_interval         0.6
cursor_stop_blinking_after    15
cursor_trail                  3
cursor_trail_decay            0.1 0.4
cursor_trail_start_threshold  2

# --- tabs: minimal bar at the bottom, only with two or more tabs ---
tab_bar_edge           bottom
tab_bar_style          separator
tab_separator          " │ "
tab_bar_margin_width   8
tab_bar_min_tabs       2
tab_title_template     " {index}  {title} "
active_tab_font_style  bold
inactive_tab_font_style normal

# --- splits ---
enabled_layouts splits,stack
inactive_text_alpha 0.75

# --- behaviour ---
scrollback_lines      10000
enable_audio_bell     no
visual_bell_duration  0.15
copy_on_select        no
mouse_map right press ungrabbed paste_from_clipboard
clipboard_control write-clipboard write-primary read-clipboard
# a desktop notification when a command of 10 s or more finishes while you look elsewhere
notify_on_cmd_finish  unfocused 10.0 notify
allow_remote_control  yes
listen_on             unix:@kitty-{kitty_pid}

# --- shortcuts (F1 shows them all) ---
map f1                launch --type=overlay --title=Shortcuts less -R ~/.config/kitty/shortcuts.txt
map ctrl+shift+enter  launch --location=split --cwd=current
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+z      toggle_layout stack
map alt+left          neighboring_window left
map alt+right         neighboring_window right
map alt+up            neighboring_window up
map alt+down          neighboring_window down
map alt+1             goto_tab 1
map alt+2             goto_tab 2
map alt+3             goto_tab 3
map alt+4             goto_tab 4
map alt+5             goto_tab 5
map ctrl+shift+f      launch --type=overlay --stdin-source=@screen_scrollback --stdin-add-formatting less +G -R
