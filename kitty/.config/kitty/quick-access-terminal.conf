# Overcast drop-down terminal: F12 (KDE shortcut) runs `kitten quick-access-terminal`,
# which slides this down from the top and hides it again on the next F12.
lines               22
edge                top
margin_left         320
margin_right        320
background_opacity  0.92
hide_on_focus_loss  yes
kitty_override      env=OVERCAST_QUICK=1
